name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: freelance_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-key-with-minimum-32-characters-for-testing
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/freelance_manager_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Lint Web
        run: npx turbo run lint --filter=web

      - name: Test API
        run: npx turbo run test --filter=api

      - name: Build Web
        run: npx turbo run build --filter=web
